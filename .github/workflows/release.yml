# Build the binaries here, not on the boxes they run on.
#
# The droplet is 1 vCPU / 961 MB: a release build with LTO needs a 2 GB
# swapfile to link at all, takes minutes, and competes for memory with the
# relay it is about to replace. Building here and downloading there makes a
# deploy a 30-second file copy.
#
# Linux is musl, statically linked, so one artifact runs on any Linux without
# caring which glibc the host shipped. macOS gets one build per architecture,
# because a laptop is where most agents actually run and `cargo install` was
# the only way onto one.
name: release

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tags, so a `v*` tag always builds.
    paths-ignore: ['**.md']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The web front end is embedded into every binary, so it is built once and
  # handed to each platform job. Building it here also means a broken front
  # end — or one that no longer typechecks — fails the release rather than
  # shipping a stale one.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `build`, not `build:oss`: the release binary is the hosted one and gets
      # the real Neon URLs. The dist committed to the repository is built
      # without them, so `cargo install --git` never inherits someone's project.
      - name: Typecheck and build the web front end
        env:
          # Both are public URLs and end up in the bundle; there is no key.
          # Repository variables, not secrets, for that reason.
          VITE_NEON_AUTH_URL: ${{ vars.NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ vars.NEON_DATA_API_URL }}
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: knoot-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: knoot-aarch64-macos
          # Cross-compiled on the Apple silicon runner: Xcode's toolchain
          # builds both architectures, and GitHub no longer has Intel runners.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: knoot-x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install the musl target
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Install the macOS target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The suite runs once, on Linux, where the relay is deployed. The macOS
      # jobs build; a macOS-only failure would show up in the build.
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --locked

      - name: Build
        env:
          # rusqlite bundles SQLite as C, and ring builds assembly; both need
          # to be told to use the musl toolchain rather than the host's.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          install -m 0755 target/${{ matrix.target }}/release/knoot ${{ matrix.artifact }}
          file ${{ matrix.artifact }}
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Statically linked, or the whole point — one artifact that runs
            # on any Linux regardless of its glibc — is lost. `file` is the
            # authority here: musl produces a static-pie, for which `ldd`
            # prints "statically linked" rather than "not a dynamic
            # executable", so grepping ldd fails a binary that is in fact fine.
            file ${{ matrix.artifact }} | grep -qE "static-pie linked|statically linked" \
              || { echo "binary is not statically linked"; exit 1; }
          fi
          # A cross-compiled binary cannot run on the builder; Rosetta is not
          # installed on the arm64 runners, so only the native ones are run.
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then ./${{ matrix.artifact }} --version; fi
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          cat ${{ matrix.artifact }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  # A push to main moves `nightly`, a single tag the provisioner can always
  # point at, plus the commit it was built from so a deploy is traceable to a
  # revision. A `v*` tag cuts a versioned release instead and leaves nightly
  # alone; that is what `install.sh` and anyone pinning a version takes. One
  # job, after every platform, so a release never carries a Linux binary from
  # one commit and a macOS binary from another.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: knoot-*
          merge-multiple: true
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # The tag must match the crate, or `knoot --version` lies about
            # which release it came from.
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            [ "$GITHUB_REF_NAME" = "v$version" ] \
              || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "knoot $GITHUB_REF_NAME" \
              --generate-notes \
              out/*
            exit 0
          fi
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "nightly ($(git rev-parse --short "$GITHUB_SHA"))" \
            --notes "Builds of $(git rev-parse --short "$GITHUB_SHA") for Linux x86_64 (static), macOS Apple silicon and macOS Intel: $(git log -1 --format=%s "$GITHUB_SHA")" \
            out/*
